# 依存関係の更新 PR を Dependabot に作らせる。
#
# PR の宛先は既定ブランチ（develop）になる。main へ直接は入らない
# （docs/branch_strategy.md）。取り込みは通常の PR と同じくレビューを経てマージする。
#
# セキュリティ更新（脆弱性が公表されたときの PR）はこのファイルとは別に、
# リポジトリの設定で有効になっている。ここで設定するのは定期的なバージョン更新のほう。
#
# どちらの ecosystem にも cooldown（公開から 7 日未満の版を拾わない）を入れている。
# 週 1 回の定期実行はその時点の最新版をすぐ拾うため、公開から数時間の版が PR に
# 入ることがあった（PR #124 の z440.atl.core 7.21.0 は公開 8.5 時間後に取り込まれた）。
# 乗っ取られたアカウントから出た悪意ある版は数日で見つかって取り下げられることが多く、
# 待つだけで避けられる。テスト用・ツール用のパッケージもビルド時に CI と手元で
# 実行されるので除外しない。
# 日数は default-days だけで指定する。semver-*-days は GitHub Actions では使えず、
# 両者の挙動を揃えておくほうが読み違えにくい。cooldown はセキュリティ更新には
# 掛からないので、脆弱性修正は遅れない。

version: 2

updates:
  # ---- NuGet -------------------------------------------------------------
  # ルートから再帰的に走査するので、src/ と tests/ の csproj がすべて対象になる。
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # メジャー更新だけは 1 件ずつ出す。破壊的変更を含みうるため、
    # まとめられると「どれが原因で落ちたか」を切り分けられない。
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # ---- GitHub Actions ----------------------------------------------------
  # ワークフローの Action はコミット SHA で固定してある（ci.yml / release.yml の
  # 冒頭コメント）。Dependabot は SHA と末尾のバージョンコメントの両方を書き換えるため、
  # 固定方針を崩さずに更新できる。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
