<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">

<!-- musicTagger のアプリアイコン（音符＋タグ）。
     配色は「音楽フォルダー時間フィッター」のアイコンと同じ 4 色で揃えている。
     16px でも形が潰れないよう、タグ本体をキャンバスいっぱいに置き、
     要素はタグ・穴・音符の 3 つだけに絞る。 -->

<g transform="translate(128,128) scale(0.95) rotate(-18) translate(-59,-98)">

  <!-- タグ本体 -->
  <path d="M59 4 L110 50 Q118 57 118 68 L118 178 Q118 192 104 192 L14 192 Q0 192 0 178 L0 68 Q0 57 8 50 Z"
        fill="#9FE1CB" stroke="#0F6E56" stroke-width="9" stroke-linejoin="round"/>

  <!-- 紐を通す穴 -->
  <circle cx="59" cy="46" r="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="8"/>

  <!-- 八分音符 -->
  <g fill="#085041">
    <ellipse cx="50" cy="158" rx="17" ry="12.5" transform="rotate(-18 50 158)"/>
    <rect x="60" y="79" width="8" height="81" rx="3"/>
    <path d="M64 79 Q106 92 99 130 Q97 103 64 113 Z"/>
  </g>

</g>

</svg>
